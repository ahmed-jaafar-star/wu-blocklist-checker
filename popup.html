<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wu BlockList Checker</title>
  <style>
    body { width: 350px; padding: 14px; font: 14px Arial, sans-serif; color: #222; }
    h3 { margin: 0 0 12px; }
    textarea { box-sizing: border-box; width: 100%; height: 160px; padding: 9px; resize: vertical; }
    button { width: 100%; margin-top: 10px; padding: 10px; border: 0; border-radius: 5px; background: #635bff; color: white; cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }
    #status { margin-top: 12px; overflow-wrap: anywhere; line-height: 1.4; }
    .hint { color: #666; font-size: 12px; line-height: 1.4; }
  </style>
</head>
<body>
  <h3>Wu BlockList Checker</h3>
  <label for="numbers">MSISDN numbers — one per line</label>
  <textarea id="numbers" placeholder="9647700000000&#10;9647700000001"></textarea>
  <p class="hint">Keep the Wu BlockList tab open and signed in while the batch runs.</p>
  <button id="start">Start checking &amp; export CSV</button>
  <div id="status" role="status">Ready</div>
  <script src="popup.js"></script>
</body>
</html>
